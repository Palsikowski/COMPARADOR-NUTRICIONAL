name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build e deploy em jobs separados, como na receita oficial do GitHub.
#
# Estavam no mesmo job, e isso quebrou o deploy três vezes seguidas hoje
# sempre no mesmo ponto: o upload termina ("Artifact github-pages has been
# successfully uploaded! Artifact ID 14568587314"), o deploy-pages pergunta
# pelo artefato 750 ms depois e recebe "Found 0 artifact(s)". É atraso de
# leitura na API de artefatos do GitHub, não erro de build — o build passava
# verde em todas as tentativas.
#
# A fronteira entre dois jobs dá à API o tempo que ela precisa, e é por isso
# que o workflow modelo do GitHub é assim. Também evita a armadilha em que
# cair: "re-run failed jobs" num job único refaz o upload e deixa DOIS
# artefatos com o mesmo nome na mesma execução, e aí o erro muda de "Found 0"
# para "Multiple artifacts named github-pages". Em caso de falha, use
# "Re-run all jobs" ou dispare o workflow de novo.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:standalone
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-standalone

  # Sem bloco `environment:` de propósito. Declarar `environment: github-pages`
  # é o que faz o endereço publicado aparecer na execução, mas neste
  # repositório esse environment tem regra de proteção de branch que não
  # inclui main, e o deploy é recusado antes de começar: 'Branch "main" is not
  # allowed to deploy to github-pages due to environment protection rules'.
  # Sem a declaração o deploy passa, com o token OIDC e a permissão
  # `pages: write` logo acima - era assim que já funcionava.
  #
  # Para ter o link na própria execução, libere main em
  # Settings > Environments > github-pages > Deployment branches
  # e então declare o environment aqui.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Publicado em ${{ steps.deployment.outputs.page_url }}"
